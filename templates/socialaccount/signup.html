{% load socialaccount %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish... — OziqMarket</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #ecfdf5, #f0fdf4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .loading {
            text-align: center;
            padding: 40px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e5e7eb;
            border-top-color: #16a34a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { color: #6b7280; font-size: 16px; }
    </style>
</head>
<body>
    <div class="loading">
        <div class="spinner"></div>
        <p>Tizimga kirilmoqda...</p>
    </div>

    <form id="autoSubmit" method="post" action="{% url 'socialaccount_signup' %}">
        {% csrf_token %}
        {{ form.as_p }}
        {# Auto-submit the form so user doesn't see the signup page #}
    </form>

    <script>
        // Auto-submit the signup form immediately
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('autoSubmit').submit();
        });
    </script>
</body>
</html>
